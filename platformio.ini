[platformio]
default_envs = nanoatmega328new

[env:nanoatmega328new]
platform = atmelavr
board = nanoatmega328new
framework = arduino
upload_port = /dev/ttyUSB0
monitor_speed = 9600

; ===== COMPILER OPTIMIZATIONS =====
build_flags =
  ; Size optimization (most important for AVR)
  -Os
  ; Function and data sectioning for dead code elimination
  -ffunction-sections
  -fdata-sections
  ; Remove exception handling (saves significant space)
  -fno-exceptions
  ; Topic bitfield configuration (8, 16, or 32)
  -DTOPIC_BITFIELD_SIZE=16
  ; Dead code elimination
  -Wl,--gc-sections
  ; Disable LTO for faster builds (enable for production if needed)
  -fno-lto
  ; Remove debug symbols in release
  -DNDEBUG
  ; Force executable suffix
  -Wl,--force-exe-suffix
  ; Additional size optimizations
  -fno-unwind-tables
  -fno-asynchronous-unwind-tables
  ; Optimize for AVR architecture
  -mmcu=atmega328p
  ; Reduce stack usage
  -fno-stack-protector
  ; Memory alignment optimizations
  -fpack-struct=1
  ; Remove unused functions more aggressively
  -fno-common
  ; Optimize for code size over speed
  -fno-inline-small-functions
  ; Custom optimization flags for embedded systems
  -DF_CPU=16000000L
  -DARDUINO_AVR_NANO
  -DARDUINO_ARCH_AVR
  ; Inject build-time memory info
  -DFSMOS_FLASH_SIZE=30720
  -DFSMOS_EEPROM_SIZE=1024

; Post-build script to inject real memory usage and force recompilation
extra_scripts = 
  post:scripts/inject_memory_info.py

; ===== LIBRARY CONFIGURATION =====
lib_deps = 
lib_ldf_mode = deep+
lib_ignore = 
  FsmOS/examples

; ===== BUILD OPTIMIZATIONS =====
; Enable parallel compilation
build_unflags = -O1 -O2 -O3 -g
; Optimize build process
build_src_flags = -pipe
; Reduce build verbosity for faster builds
build_src_filter = +<*> -<.git/> -<.svn/> -<example/> -<examples/> -<test/> -<tests/>

; ===== UPLOAD OPTIMIZATIONS =====
; Faster upload with verification
upload_flags = -D
; Skip verification for faster uploads (uncomment if needed)
; upload_flags = -D -V

; ===== MONITOR OPTIMIZATIONS =====
; Optimize serial monitor
monitor_filters = 
  default
  time

; ===== MEMORY OPTIMIZATIONS =====
; Enable memory usage reporting (use size target instead)
; Custom linker script for memory optimization (if needed)
; board_build.ldscript = custom.ld

; ===== DEBUG CONFIGURATION =====
; Debug configuration (uncomment for debugging)
; debug_tool = avr-stub
; debug_init_break = tbreak setup
; debug_load_mode = manual

; ===== ALTERNATIVE BUILD ENVIRONMENTS =====

; Debug environment with full debugging support
[env:nanoatmega328new_debug]
platform = atmelavr
board = nanoatmega328new
framework = arduino
upload_port = /dev/ttyUSB2
monitor_speed = 9600
build_flags =
  -g
  -O0
  -DDEBUG
  -ffunction-sections
  -fdata-sections
  -fno-exceptions
  -fno-rtti
  -Wl,--gc-sections
  -mmcu=atmega328p
  -DF_CPU=16000000L
  -DARDUINO_AVR_NANO
  -DARDUINO_ARCH_AVR
lib_deps = 
lib_ldf_mode = deep+
lib_ignore = 
  FsmOS/examples
debug_tool = avr-stub
debug_init_break = tbreak setup
debug_load_mode = manual

; Maximum size optimization environment
[env:nanoatmega328new_size]
platform = atmelavr
board = nanoatmega328new
framework = arduino
upload_port = /dev/ttyUSB2
monitor_speed = 9600
build_flags =
  -Os
  -ffunction-sections
  -fdata-sections
  -fno-exceptions
  -fno-rtti
  -Wl,--gc-sections
  -fno-lto
  -DNDEBUG
  -Wl,--force-exe-suffix
  -fno-unwind-tables
  -fno-asynchronous-unwind-tables
  -mmcu=atmega328p
  -fno-stack-protector
  -fpack-struct=1
  -fno-common
  -fno-inline-small-functions
  -DF_CPU=16000000L
  -DARDUINO_AVR_NANO
  -DARDUINO_ARCH_AVR
  ; Additional aggressive size optimizations
  -fno-inline
  -fno-optimize-sibling-calls
  -fno-caller-saves
  -fno-reorder-blocks
  -fno-reorder-functions
lib_deps = 
lib_ldf_mode = deep+
lib_ignore = 
  FsmOS/examples

; Speed optimization environment (if memory allows)
[env:nanoatmega328new_speed]
platform = atmelavr
board = nanoatmega328new
framework = arduino
upload_port = /dev/ttyUSB2
monitor_speed = 9600
build_flags =
  -O2
  -ffunction-sections
  -fdata-sections
  -fno-exceptions
  -fno-rtti
  -Wl,--gc-sections
  -DNDEBUG
  -Wl,--force-exe-suffix
  -mmcu=atmega328p
  -fno-stack-protector
  -fpack-struct=1
  -fno-common
  -DF_CPU=16000000L
  -DARDUINO_AVR_NANO
  -DARDUINO_ARCH_AVR
  ; Speed optimizations
  -finline-functions
  -foptimize-sibling-calls
  -fomit-frame-pointer
lib_deps = 
lib_ldf_mode = deep+
lib_ignore = 
  FsmOS/examples
